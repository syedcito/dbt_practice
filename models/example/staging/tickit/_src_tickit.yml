sources:
  - name: tickit
    database: raw
    schema: tickit
    tables:
      - name: users
        description: Raw user data loaded from the public TICKIT S3 bucket.
        columns:
          - name: userid
            description: Unique identifier for a user.
            tests:
              - unique
              - not_null
          - name: username
            description: The user's login/display name.
          - name: firstname
            description: User's first name.
          - name: lastname
            description: User's last name.
          - name: city
            description: City the user is located in.
          - name: state
            description: State the user is located in.
          - name: email
            description: User's email address.
          - name: phone
            description: User's phone number.

      - name: sales
        description: Raw sales/transaction data loaded from the public TICKIT S3 bucket.
        columns:
          - name: salesid
            description: Unique identifier for a sale transaction.
            tests:
              - unique
              - not_null
          - name: listid
            description: Identifier for the ticket listing this sale came from.
          - name: sellerid
            description: The user who sold the ticket.
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tickit', 'users')
                    field: userid
          - name: buyerid
            description: The user who bought the ticket.
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('tickit', 'users')
                    field: userid
          - name: eventid
            description: Identifier for the event the ticket was for.
          - name: dateid
            description: Identifier for the date dimension (not loaded in this project).
          - name: qtysold
            description: Number of tickets included in this sale.
          - name: pricepaid
            description: Total price paid for the tickets in this sale.
          - name: commission
            description: Commission taken by the platform on this sale.
          - name: saletime
            description: Timestamp of when the sale occurred.